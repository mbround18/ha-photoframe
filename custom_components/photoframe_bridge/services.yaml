display_photo:
  name: Show next photo
  description: Advance the frame to the next photo immediately.
  fields:
    device_id:
      name: Frame
      description: Which frame to advance. Omit to advance every frame.
      required: false
      selector:
        text:

send_command:
  name: Send command
  description: Send a control command to a frame.
  fields:
    command:
      name: Command
      description: "One of: next, previous, refresh, reload_ui, reboot."
      required: true
      selector:
        select:
          options: [next, previous, refresh, reload_ui, reboot]
    device_id:
      name: Frame
      description: Which frame to command. Omit to command every frame.
      required: false
      selector:
        text:
