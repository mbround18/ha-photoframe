# Vendored from the manufacturer's own demo bundle (see docs/Hardware-Reference.md).
#
# esp_lvgl_port / lvgl are deliberately absent: this firmware draws with
# embedded-graphics, and the LVGL port has been a source of version churn.
#
# esp_lcd_touch_gsl3680 is vendored alongside this component rather than pulled
# from the registry, where it does not exist. It ships with no licence and no
# SPDX header; see its PROVENANCE.md before redistributing this repository.
dependencies:
  esp_codec_dev:
    public: true
    version: ~1.3.2
  esp_lcd_ek79007: '>=2.0.1,<3.0.0'
  esp_lcd_ili9881c:
    version: '>=1.0.3,<2.0.0'
  esp_lcd_touch_gsl3680:
    path: ../esp_lcd_touch_gsl3680
  esp_lcd_jd9365: 
    path: ../esp_lcd_jd9365
  esp_video:
    public: true
    version: ~2.0
  espressif/esp_lcd_lt8912b:
    version: '>=0.1.3,<1.0.0'
  idf: '>=5.4'
  usb:
    public: true
    rules:
    - if: idf_version >=6.0
    version: ^1.0.0
