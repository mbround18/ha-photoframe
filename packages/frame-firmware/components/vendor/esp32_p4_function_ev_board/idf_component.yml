# Vendored from the manufacturer's own demo bundle (see docs/Hardware-Reference.md).
# Two dependencies were removed deliberately:
#   esp_lcd_touch_gsl3680 - ships with no licence or SPDX header, so it is not
#     redistributed here. Touch is unused; the reset gesture uses the BOOT button.
#   esp_lvgl_port / lvgl  - this firmware renders with Slint, not LVGL, and the
#     LVGL port has been a source of version churn.
dependencies:
  esp_codec_dev:
    public: true
    version: ~1.3.2
  esp_lcd_ek79007: '>=2.0.1,<3.0.0'
  esp_lcd_ili9881c:
    version: '>=1.0.3,<2.0.0'
  esp_lcd_touch_gt911:
    version: ^1
  esp_lcd_jd9365: 
    path: ../esp_lcd_jd9365
  esp_video:
    public: true
    version: ~2.0
  espressif/esp_lcd_lt8912b:
    version: '>=0.1.3,<1.0.0'
  idf: '>=5.4'
  usb:
    public: true
    rules:
    - if: idf_version >=6.0
    version: ^1.0.0
description: Board Support Package (BSP) for ESP32-P4 Function EV Board (preview)
repository: git://github.com/espressif/esp-bsp.git
repository_info:
