[package]
name = "frame-firmware"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
frame-api = { path = "../frame-api" }
frame-captive-portal = { path = "../frame-captive-portal" }
frame-core = { path = "../frame-core" }
frame-net = { path = "../frame-net" }
frame-ui = { path = "../frame-ui" }

# `anyhow` and `log` serve as the top-level error handling and logging
# frameworks for the entire application.
anyhow = "1.0.102"
log = "0.4.29"
tracing = { version = "0.1.41", features = ["attributes"] }
tracing-log = "0.2.0"
tracing-subscriber = { version = "0.3.20", default-features = false, features = [
  "fmt",
  "std",
  "ansi",
] }
rand = "0.8.5"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
serde_json = "1.0.145"
tungstenite = { version = "0.24.0", default-features = false, features = ["handshake"] }
url = "2.5.7"

[target.'cfg(not(target_os = "espidf"))'.dependencies]
reqwest = { version = "0.12.23", default-features = false, features = ["blocking", "rustls-tls"] }

[target.'cfg(target_os = "espidf")'.dependencies]
# `esp-idf-sys` provides the low-level FFI (Foreign Function Interface)
# bindings to the underlying ESP-IDF C libraries. The "binstart" feature
# is critical as it includes the necessary boilerplate to properly initialize
# the Rust runtime environment on the ESP32.
embedded-svc = "0.29.0"
esp-idf-sys = { version = "0.37.2", features = ["binstart"] }
esp-idf-hal = "0.46.2"
esp-idf-svc = { version = "0.52.1", default-features = false }

[build-dependencies]
dotenvy = "0.15.7"
embuild = { version = "0.33.1", features = ["espidf"] }

[[package.metadata.esp-idf-sys.extra_components]]
component_dirs = ["components", "../../tmp/common_components"]

[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/esp_wifi_remote", version = "*" }

# Pin esp_hosted to the 2.12 line. 3.0 renamed the hosted-BT Kconfig symbols
# (ESP_HOSTED_ENABLE_BT_NIMBLE / ESP_HOSTED_NIMBLE_HCI_VHCI are gone) and its
# CMake fails loudly on the old ones. The T056 BLE spike was verified working
# against 2.12.3 on real hardware, so hold there deliberately rather than let a
# transitive resolve drift us across a major version.
# Revisit with esp-hosted's migration guide before moving to 3.x.
[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/esp_hosted", version = "~2.12" }

# esp_lvgl_port 2.9.0 references esp_lcd_dpi_panel_event_callbacks_t's
# `on_frame_buf_complete`, which does not exist in ESP-IDF 5.5.3. Hold at the
# 2.7 line that this project is known to build against.
[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/esp_lvgl_port", version = "~2.7" }

[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/esp32_p4_function_ev_board", version = "*" }

# This board's panel is a JD9365, not the ILI9881C the upstream BSP installs for
# CONFIG_BSP_LCD_TYPE_1280_800. See docs/Hardware-Reference.md section 6.
[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/esp_lcd_jd9365", version = "^1.0.2" }
