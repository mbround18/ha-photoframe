[package]
name = "frame-api"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
build = "build.rs"

[dependencies]
# `serde` and `serde_json` are essential for deserializing the JSON responses
# from the Home Assistant control plane into structured Rust types.
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

# `anyhow` is used for convenient error handling when making HTTP calls.
anyhow = "1.0.102"

# `log` allows for detailed logging of requests, responses, and errors.
log = "0.4.29"

# Shared domain models stay host-testable in `frame-core`.
frame-core = { path = "../frame-core" }

[target.'cfg(not(target_os = "espidf"))'.dependencies]
# Host builds use reqwest to fetch prepared photos from Home Assistant.
reqwest = { version = "0.12.5", default-features = false, features = [
  "blocking",
  "json",
] }

[target.'cfg(target_os = "espidf")'.dependencies]
embedded-svc = "0.29.0"
esp-idf-svc = { version = "0.52.1", default-features = false, features = [
  "alloc",
] }
