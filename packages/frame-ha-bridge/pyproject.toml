[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "frame-ha-bridge"
version = "0.1.0"
description = "Home Assistant companion bindings for the photo frame control protocol"
readme = "README.md"
license = { text = "MIT OR Apache-2.0" }
requires-python = ">=3.11"
authors = [
	{ name = "PhotoFrame Contributors" },
]
classifiers = [
	"Development Status :: 3 - Alpha",
	"Intended Audience :: Developers",
	"License :: OSI Approved :: MIT License",
	"License :: OSI Approved :: Apache Software License",
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3.11",
	"Programming Language :: Python :: 3.12",
	"Programming Language :: Rust",
	"Topic :: Home Automation",
]
keywords = ["home-assistant", "photoframe", "pyo3", "websocket", "slint"]

[tool.maturin]
bindings = "pyo3"
manifest-path = "Cargo.toml"
python-source = "python"
module-name = "frame_ha_bridge._native"
features = ["python-extension"]