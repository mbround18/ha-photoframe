[package]
name = "frame-ha-bridge"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[features]
default = []
python-extension = ["pyo3/extension-module"]

[lib]
name = "frame_ha_bridge"
crate-type = ["cdylib", "rlib"]

[dependencies]
frame-core = { path = "../frame-core" }
pyo3 = { version = "0.23.5", features = ["abi3-py311", "auto-initialize"] }
serde_json = "1.0.149"