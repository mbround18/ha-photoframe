[package]
name = "frame-net"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
anyhow = "1.0.82"
once_cell = "1.19.0"
log = "0.4.21"
rand = "0.8.5"
serde = { version = "1.0", features = ["derive"] }

frame-core = { path = "../frame-core" }
frame-captive-portal = { path = "../frame-captive-portal" }

[target.'cfg(target_os = "espidf")'.dependencies]
esp-idf-svc = { version = "0.52.1", features = ["experimental", "alloc"] }

[build-dependencies]
dotenvy = "0.15.7"
