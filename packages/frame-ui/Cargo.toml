[package]
name = "frame-ui"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
frame-core = { path = "../frame-core" }

# `embedded-graphics` is a foundational crate for 2D graphics in embedded
# Rust. It provides traits and primitives for drawing, which are used by
# higher-level display drivers and UI libraries.
embedded-graphics = "0.8.2"

# The `image` crate is the de-facto standard for image processing in Rust.
# We use it specifically for its JPEG decoding capability to process the
# photos downloaded from Home Assistant into a raw pixel format that can be
# sent to the display.
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }

# `anyhow` and `log` are used for error handling and logging within the UI
# component, respectively.
anyhow = "1.0.102"
log = "0.4.29"

[target.'cfg(not(target_os = "espidf"))'.dependencies]

[target.'cfg(target_os = "espidf")'.dependencies]
esp-idf-hal = "0.46.2"
esp-idf-sys = { version = "0.37.2", default-features = false }

