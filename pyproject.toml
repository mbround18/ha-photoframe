[project]
name = "photoframe"
version = "0.1.0"
description = "Home Assistant-managed digital photo frame: ESP32-P4 firmware and the photoframe_bridge integration"
readme = "README.md"
requires-python = ">=3.13"
# esptool is the only runtime Python this project needs outside Home Assistant
# itself: the firmware is Rust and the integration runs inside Home Assistant,
# which brings its own dependencies.
dependencies = [
    "esptool>=5.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-homeassistant-custom-component>=0.13",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# The integration lives at the repo root for HACS, so the repo root has to be
# importable for `custom_components.photoframe_bridge...` to resolve.
pythonpath = ["."]

[build-system]
requires = ["uv_build>=0.11.7,<0.12"]
build-backend = "uv_build"